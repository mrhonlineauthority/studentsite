<html lang="en">
<head>

        const firebaseConfig = {

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        
        .app-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        .header {
            background: linear-gradient(to right, #4a00e0, #8e2de2);
            color: white;
            padding: 20px 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            padding: 20px 16px;
            max-width: 100%;
            overflow-x: hidden;
        }
        
        /* Form Containers */
        .form-container {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        
        .form-container.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Form Styling */
        .form-card {
            background: white;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .form-title {
            color: #333;
            font-size: 1.4rem;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #8e2de2;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f9f9f9;
        }
        
        .form-input:focus {
            border-color: #8e2de2;
            background: white;
            outline: none;
            box-shadow: 0 0 0 3px rgba(142, 45, 226, 0.1);
        }
        
        select.form-input {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 18px;
            padding-right: 50px;
        }
        
        /* Step Indicator */
        .step-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
        }
        
        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            position: relative;
            z-index: 2;
        }
        
        .step-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e1e1e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.1rem;
            color: #777;
            margin-bottom: 8px;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        
        .step.active .step-circle {
            background: #8e2de2;
            color: white;
            transform: scale(1.05);
        }
        
        .step-text {
            font-size: 0.85rem;
            color: #777;
            font-weight: 600;
            text-align: center;
        }
        
        .step.active .step-text {
            color: #8e2de2;
        }
        
        .step-line {
            position: absolute;
            top: 22px;
            left: 10%;
            right: 10%;
            height: 3px;
            background: #e1e1e1;
            z-index: 1;
        }
        
        .step-line-progress {
            position: absolute;
            top: 22px;
            left: 10%;
            width: 50%;
            height: 3px;
            background: #8e2de2;
            z-index: 1;
            transition: width 0.3s;
        }
        
        /* Buttons */
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        
        .button i {
            margin-right: 8px;
        }
        
        .button-primary {
            background: linear-gradient(to right, #8e2de2, #4a00e0);
            color: white;
        }
        
        .button-primary:hover, .button-primary:active {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(142, 45, 226, 0.3);
        }
        
        .button-secondary {
            background: #6c757d;
            color: white;
        }
        
        .button-success {
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
        }
        
        .button-danger {
            background: #dc3545;
            color: white;
        }
        
        /* Form Actions */
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        .form-actions .button {
            flex: 1;
            margin-top: 0;
        }
        
        /* Subject Entry */
        .subject-entry {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            border-left: 4px solid #8e2de2;
        }
        
        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .subject-title {
            font-size: 1.1rem;
            color: #333;
            font-weight: 600;
        }
        
        .remove-subject {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .remove-subject:hover {
            background: #c82333;
            transform: scale(1.05);
        }
        
        .subject-fields {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        /* Add Subject Button */
        .add-subject-btn {
            background: #17a2b8;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
            transition: all 0.3s;
        }
        
        .add-subject-btn:hover {
            background: #138496;
            transform: translateY(-2px);
        }
        
        .add-subject-btn i {
            margin-right: 10px;
        }
        
        /* Messages */
        .message {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        /* Logout Button */
        .logout-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
            z-index: 1000;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4);
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 16px;
            color: white;
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: auto;
        }
        
        /* Mobile Optimizations */
        @media (max-width: 480px) {
            .header {
                padding: 16px 12px;
            }
            
            .header h1 {
                font-size: 1.3rem;
            }
            
            .main-content {
                padding: 16px 12px;
            }
            
            .form-card {
                padding: 20px 16px;
                border-radius: 14px;
            }
            
            .form-title {
                font-size: 1.3rem;
            }
            
            .step-circle {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            
            .step-line, .step-line-progress {
                top: 20px;
            }
            
            .button {
                padding: 14px 20px;
            }
            
            .logout-btn {
                bottom: 16px;
                right: 16px;
                width: 52px;
                height: 52px;
            }
        }
        
        /* Tablet View */
        @media (min-width: 768px) {
            .app-container {
                max-width: 700px;
                margin: 0 auto;
                min-height: 100vh;
                background: white;
                box-shadow: 0 0 30px rgba(0,0,0,0.1);
            }
            
            body {
                padding: 20px;
                background: #f5f5f5;
            }
            
            .subject-fields {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
            
            .logout-btn {
                position: absolute;
                top: 20px;
                right: 20px;
                bottom: auto;
            }
        }
        
        /* Loading Spinner */
        .spinner {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Main JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const loginForm = document.getElementById('loginForm');
            const resultForm = document.getElementById('resultForm');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginMessage = document.getElementById('loginMessage');
            const nextBtn = document.getElementById('nextBtn');
            const prevBtn = document.getElementById('prevBtn');
            const submitBtn = document.getElementById('submitBtn');
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const step1Indicator = document.getElementById('step1Indicator');
            const step2Indicator = document.getElementById('step2Indicator');
            const stepProgress = document.getElementById('stepProgress');
            const addSubjectBtn = document.getElementById('addSubjectBtn');
            const subjectsContainer = document.getElementById('subjectsContainer');
            
            // Variables
            let currentStep = 1;
            let subjectCount = 1;
            
            // Show message function
            function showMessage(element, message, type) {
                element.textContent = message;
                element.className = `message ${type}`;
                element.style.display = 'block';
                
                setTimeout(() => {
                    element.style.display = 'none';
                }, 5000);
            }
            
            // Update step indicator
            function updateStepIndicator() {
                if (currentStep === 1) {
                    step1Indicator.classList.add('active');
                    step2Indicator.classList.remove('active');
                    stepProgress.style.width = '0%';
                } else {
                    step1Indicator.classList.remove('active');
                    step2Indicator.classList.add('active');
                    stepProgress.style.width = '100%';
                }
            }
            
            // Login function
            loginBtn.addEventListener('click', async () => {
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                
                if (!email || !password) {
                    showMessage(loginMessage, "Please enter email and password", "error");
                    return;
                }
                
                loginBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> Logging in...';
                loginBtn.disabled = true;
                
                try {
                    await window.firebase.signInWithEmailAndPassword(
                        window.firebase.auth, 
                        email, 
                        password
                    );
                    
                    // Login successful
                    loginForm.classList.remove('active');
                    resultForm.classList.add('active');
                    logoutBtn.style.display = 'flex';
                    
                    // Clear login form
                    emailInput.value = '';
                    passwordInput.value = '';
                    
                    // Set today's date as default
                    const today = new Date().toISOString().split('T')[0];
                    document.getElementById('dob').value = today;
                    
                } catch (error) {
                    console.error("Login error:", error);
                    let errorMessage = "Login failed. ";
                    
                    switch (error.code) {
                        case 'auth/invalid-email':
                            errorMessage = "Invalid email address";
                            break;
                        case 'auth/user-not-found':
                            errorMessage = "No account found with this email";
                            break;
                        case 'auth/wrong-password':
                            errorMessage = "Incorrect password";
                            break;
                        default:
                            errorMessage = error.message;
                    }
                    
                    showMessage(loginMessage, errorMessage, "error");
                } finally {
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                    loginBtn.disabled = false;
                }
            });
            
            // Logout function
            logoutBtn.addEventListener('click', async () => {
                try {
                    await window.firebase.signOut(window.firebase.auth);
                    resultForm.classList.remove('active');
                    loginForm.classList.add('active');
                    logoutBtn.style.display = 'none';
                    resetForm();
                } catch (error) {
                    console.error("Logout error:", error);
                }
            });
            
            // Next button click
            nextBtn.addEventListener('click', () => {
                // Validate step 1 fields
                const requiredFields = ['regNo', 'rollNo', 'name', 'examination', 'year', 'board', 'group', 'dob', 'resultStatus', 'gpa'];
                let isValid = true;
                
                requiredFields.forEach(field => {
                    const element = document.getElementById(field);
                    if (!element.value.trim()) {
                        isValid = false;
                        element.style.borderColor = '#dc3545';
                    } else {
                        element.style.borderColor = '#e1e1e1';
                    }
                });
                
                // Validate GPA format
                const gpa = document.getElementById('gpa').value.trim();
                if (!/^\d+(\.\d+)?$/.test(gpa)) {
                    showMessage(document.getElementById('step1Message'), "Please enter a valid GPA (e.g., 4.50 or 5.00)", "error");
                    document.getElementById('gpa').style.borderColor = '#dc3545';
                    return;
                }
                
                if (!isValid) {
                    showMessage(document.getElementById('step1Message'), "Please fill all required fields", "error");
                    return;
                }
                
                // Move to step 2
                currentStep = 2;
                updateStepIndicator();
                step1.style.display = 'none';
                step2.style.display = 'block';
            });
            
            // Previous button click
            prevBtn.addEventListener('click', () => {
                currentStep = 1;
                updateStepIndicator();
                step2.style.display = 'none';
                step1.style.display = 'block';
            });
            
            // Add subject entry
            addSubjectBtn.addEventListener('click', () => {
                subjectCount++;
                const subjectEntry = document.createElement('div');
                subjectEntry.className = 'subject-entry';
                subjectEntry.id = `subjectEntry${subjectCount}`;
                
                subjectEntry.innerHTML = `
                    <div class="subject-header">
                        <div class="subject-title">Subject ${subjectCount}</div>
                        <button type="button" class="remove-subject" onclick="removeSubject(${subjectCount})">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="subject-fields">
                        <div class="form-group">
                            <label class="form-label">Subject Code *</label>
                            <select id="subjectCode${subjectCount}" class="form-input subject-code" required>
                                <option value="">Select Code</option>
                                <option value="101">101 - Bangla</option>
                                <option value="107">107 - English</option>
                                <option value="109">109 - Mathematics</option>
                                <option value="111">111 - Islam & Moral Ed.</option>
                                <option value="127">127 - Science</option>
                                <option value="154">154 - ICT</option>
                                <option value="138">138 - Biology</option>
                                <option value="143">143 - Business Studies</option>
                                <option value="153">153 - History</option>
                                <option value="134">134 - Agriculture</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Subject Name *</label>
                            <input type="text" id="subjectName${subjectCount}" class="form-input subject-name" placeholder="Auto-filled" readonly>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Grade *</label>
                            <select id="grade${subjectCount}" class="form-input" required>
                                <option value="">Select Grade</option>
                                <option value="A+">A+</option>
                                <option value="A">A</option>
                                <option value="A-">A-</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="F">F</option> <!-- New F Grade Added -->
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Marks *</label>
                            <input type="number" id="receivedNumber${subjectCount}" class="form-input" placeholder="Enter marks (0-100)" min="0" max="100" required>
                        </div>
                    </div>
                `;
                
                subjectsContainer.appendChild(subjectEntry);
                
                // Add event listener for subject code change
                const subjectCodeSelect = document.getElementById(`subjectCode${subjectCount}`);
                subjectCodeSelect.addEventListener('change', updateSubjectName);
                
                // Show remove button for all subjects
                document.querySelectorAll('.remove-subject').forEach(btn => {
                    btn.style.display = 'flex';
                });
                
                // Scroll to new subject
                subjectEntry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
            
            // Function to remove subject entry
            window.removeSubject = function(id) {
                if (subjectCount > 1) {
                    const subjectEntry = document.getElementById(`subjectEntry${id}`);
                    if (subjectEntry) {
                        subjectEntry.remove();
                        subjectCount--;
                        
                        // Rename remaining subjects
                        const subjectEntries = subjectsContainer.getElementsByClassName('subject-entry');
                        for (let i = 0; i < subjectEntries.length; i++) {
                            const newId = i + 1;
                            subjectEntries[i].id = `subjectEntry${newId}`;
                            subjectEntries[i].querySelector('.subject-title').textContent = `Subject ${newId}`;
                            
                            const removeBtn = subjectEntries[i].querySelector('.remove-subject');
                            removeBtn.setAttribute('onclick', `removeSubject(${newId})`);
                            
                            // Update input IDs
                            const inputs = subjectEntries[i].querySelectorAll('input, select');
                            inputs[0].id = `subjectCode${newId}`;
                            inputs[1].id = `subjectName${newId}`;
                            inputs[2].id = `grade${newId}`;
                            inputs[3].id = `receivedNumber${newId}`;
                        }
                        
                        // Hide remove button if only one subject
                        if (subjectCount === 1) {
                            document.querySelector('.remove-subject').style.display = 'none';
                        }
                    }
                }
            };
            
            // Function to update subject name based on code
            function updateSubjectName(event) {
                const subjectCode = event.target.value;
                const subjectEntry = event.target.closest('.subject-entry');
                const subjectNameInput = subjectEntry.querySelector('.subject-name');
                
                const subjectMap = {
                    '101': 'Bangla',
                    '107': 'English',
                    '109': 'Mathematics',
                    '111': 'Islam and Moral Education',
                    '127': 'Science',
                    '154': 'ICT',
                    '138': 'Biology',
                    '143': 'Business Entrepreneurship',
                    '153': 'History Of Bangladesh And World Civilization',
                    '134': 'Agricultural Studies'
                };
                
                subjectNameInput.value = subjectMap[subjectCode] || '';
            }
            
            // Add event listeners for subject code changes
            document.addEventListener('DOMContentLoaded', () => {
                const subjectCodeSelects = document.querySelectorAll('.subject-code');
                subjectCodeSelects.forEach(select => {
                    select.addEventListener('change', updateSubjectName);
                });
            });
            
            // Submit result
            submitBtn.addEventListener('click', async () => {
                // Validate all subject fields
                let isValid = true;
                const subjectEntries = subjectsContainer.getElementsByClassName('subject-entry');
                
                for (let i = 0; i < subjectEntries.length; i++) {
                    const subjectCode = subjectEntries[i].querySelector('.subject-code').value;
                    const subjectName = subjectEntries[i].querySelector('.subject-name').value;
                    const grade = subjectEntries[i].querySelector('select[id^="grade"]').value;
                    const receivedNumber = subjectEntries[i].querySelector('input[id^="receivedNumber"]').value;
                    
                    if (!subjectCode || !subjectName || !grade || !receivedNumber) {
                        isValid = false;
                        const inputs = subjectEntries[i].querySelectorAll('input, select');
                        inputs.forEach(input => {
                            if (!input.value) input.style.borderColor = '#dc3545';
                        });
                    }
                }
                
                if (!isValid) {
                    showMessage(document.getElementById('step2Message'), "Please fill all subject fields", "error");
                    return;
                }
                
                // Collect all data
                const regNo = document.getElementById('regNo').value.trim();
                const rollNo = document.getElementById('rollNo').value.trim();
                const name = document.getElementById('name').value.trim();
                const examination = document.getElementById('examination').value;
                const year = document.getElementById('year').value;
                const board = document.getElementById('board').value;
                const group = document.getElementById('group').value; // New group field
                const dob = document.getElementById('dob').value;
                const resultStatus = document.getElementById('resultStatus').value;
                const gpa = document.getElementById('gpa').value.trim();
                
                // Collect subjects data
                const subjects = [];
                for (let i = 1; i <= subjectCount; i++) {
                    const subjectCode = document.getElementById(`subjectCode${i}`);
                    const subjectName = document.getElementById(`subjectName${i}`);
                    const grade = document.getElementById(`grade${i}`);
                    const receivedNumber = document.getElementById(`receivedNumber${i}`);
                    
                    if (subjectCode && subjectName && grade && receivedNumber) {
                        subjects.push({
                            code: subjectCode.value,
                            name: subjectName.value,
                            grade: grade.value,
                            receivedNumber: receivedNumber.value
                        });
                    }
                }
                
                // Prepare data for database
                const resultData = {
                    regNo,
                    rollNo,
                    name,
                    examination,
                    year: parseInt(year),
                    board,
                    group, // Added group field
                    dob,
                    result: resultStatus,
                    gpa,
                    subjects,
                    createdAt: Date.now(),
                    lastUpdated: Date.now()
                };
                
                // Generate unique key
                const resultKey = `${regNo}_${rollNo}`.replace(/[.#$\/\[\]]/g, '_');
                
                // Show loading
                submitBtn.innerHTML = '<i class="fas fa-spinner spinner"></i> Submitting...';
                submitBtn.disabled = true;
                
                try {
                    // Save to Firebase
                    const dbRef = window.firebase.ref(window.firebase.database, `results/${resultKey}`);
                    await window.firebase.set(dbRef, resultData);
                    
                    showMessage(document.getElementById('step2Message'), "✅ Result submitted successfully!", "success");
                    
                    // Reset form after delay
                    setTimeout(() => {
                        resetForm();
                        currentStep = 1;
                        updateStepIndicator();
                        step2.style.display = 'none';
                        step1.style.display = 'block';
                        
                        // Scroll to top
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }, 2000);
                    
                } catch (error) {
                    console.error("Database error:", error);
                    showMessage(document.getElementById('step2Message'), `❌ Error: ${error.message}`, "error");
                } finally {
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> Submit Result';
                    submitBtn.disabled = false;
                }
            });
            
            // Reset form function
            function resetForm() {
                // Reset all form fields
                const formFields = ['regNo', 'rollNo', 'name', 'gpa'];
                formFields.forEach(field => {
                    document.getElementById(field).value = '';
                });
                
                const selectFields = ['examination', 'year', 'board', 'group', 'resultStatus'];
                selectFields.forEach(field => {
                    document.getElementById(field).value = '';
                });
                
                // Reset subjects
                while (subjectsContainer.children.length > 1) {
                    subjectsContainer.removeChild(subjectsContainer.lastChild);
                }
                
                // Reset first subject
                document.getElementById('subjectCode1').value = '';
                document.getElementById('subjectName1').value = '';
                document.getElementById('grade1').value = '';
                document.getElementById('receivedNumber1').value = '';
                
                subjectCount = 1;
                
                // Hide remove button for first subject
                document.querySelector('.remove-subject').style.display = 'none';
                
                // Reset borders
                document.querySelectorAll('.form-input').forEach(input => {
                    input.style.borderColor = '#e1e1e1';
                });
            }
            
            // Authentication state observer
            window.firebase.onAuthStateChanged(window.firebase.auth, (user) => {
                if (user) {
                    loginForm.classList.remove('active');
                    resultForm.classList.add('active');
                    logoutBtn.style.display = 'flex';
                } else {
                    loginForm.classList.add('active');
                    resultForm.classList.remove('active');
                    logoutBtn.style.display = 'none';
                }
            });
            
            // Initialize
            updateStepIndicator();
            step2.style.display = 'none';
            
            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dob').value = today;
            
            // Hide remove button for first subject
            document.querySelector('.remove-subject').style.display = 'none';
            
            // Add initial event listener for subject code
            const subjectCodeSelect = document.getElementById('subjectCode1');
            if (subjectCodeSelect) {
                subjectCodeSelect.addEventListener('change', updateSubjectName);
            }
            
            // Keyboard support for login
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loginBtn.click();
                }
            });
        });
    </script>
</body>
</html>
